  <text x="150" y="304" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Source Han Sans SC, sans-serif" font-size="12" fill="#6B7C86" letter-spacing="0.6">ISO 3166-1 · 南北半球 · 四季</text></g><g class="ex-face"><path d="M 119.35,125.96 Q 126,115.95 132.65,125.96" fill="none" stroke="#22313A" stroke-width="1.8" stroke-linecap="round"/><path class="ex-anim-pulse" style="animation-delay:0s" d="M 174,126.79 C 166.5,121.06 169.74,115.77 174,120.47 C 178.26,115.77 181.5,121.06 174,126.79 Z" fill="#FF7AA2"/><ellipse cx="150" cy="139.4" rx="3.8" ry="2.77" fill="none" stroke="#22313A" stroke-width="1.7"/><ellipse class="ex-anim-pulse" cx="120.75" cy="133.45" rx="5.46" ry="2.94" fill="#FF7A90" opacity="0.7"/><ellipse class="ex-anim-pulse" cx="179.25" cy="133.45" rx="5.46" ry="2.94" fill="#FF7A90" opacity="0.7"/><path class="ex-anim-heart" style="animation-delay:0.0s" d="M 118.22,98.06 C 113.23,94.24 115.38,90.71 118.22,93.84 C 121.07,90.71 123.22,94.24 118.22,98.06 Z" fill="#FF7AA2"/><path class="ex-anim-heart" style="animation-delay:0.7s" d="M 184.42,91.04 C 180.5,88.04 182.19,85.26 184.42,87.73 C 186.66,85.26 188.35,88.04 184.42,91.04 Z" fill="#FF7AA2"/><path class="ex-anim-heart" style="animation-delay:1.3s" d="M 173.83,110.45 C 171.12,108.37 172.29,106.46 173.83,108.16 C 175.37,106.46 176.55,108.37 173.83,110.45 Z" fill="#FF7AA2"/></g></g></svg>