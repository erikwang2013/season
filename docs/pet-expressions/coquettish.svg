    </linearGradient>
    <linearGradient id="g-autumn" x1="1" y1="1" x2="0.1" y2="0.1">
      <stop offset="0" stop-color="#EE8A44"/>
      <stop offset="1" stop-color="#F3B96C"/>
    </linearGradient>
    <radialGradient id="g-gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-body">
      <circle cx="150" cy="134" r="76"/>
    </clipPath>
    <g id="flake-arm" fill="none">
      <line x1="0" y1="0" x2="0" y2="-20"/>
