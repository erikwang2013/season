<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="arch-title arch-desc"
     font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Source Han Sans SC, sans-serif">
  <title id="arch-title">season 架构设计：使用方 → 集成层 → 服务层 → 核心层 → 数据层</title>
  <desc id="arch-desc">分层架构图。上图：原生 PHP 与 Laravel / ThinkPHP / Hyperf / webman 五类使用方；集成层由各框架的服务提供者与 webman 安装器组成；服务层 SeasonService 持有默认国家码并代理核心 API；核心层 CountrySeason 与全局函数 helpers.php；数据层为南半球代码表、月份到季节映射与 LocaleData 多语言数据。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FA8A2"/>
    </marker>
    <marker id="ar-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B9C9C4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="660" rx="28" fill="#F7FAF9"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="#22313A">架构设计 · Architecture</text>
  <text x="40" y="82" font-size="13" fill="#6B7C86">season — 输入一个 ISO 3166-1 alpha-2 国家码，输出该国家当前季节；可作纯 Composer 库，也可挂到四种框架容器。</text>

  <!-- ── 泳道 1：使用方 ── -->
  <rect x="40" y="100" width="650" height="78" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="132" font-size="13.5" font-weight="700" fill="#22313A">使用方</text>
  <text x="56" y="152" font-size="11" fill="#8FA8A2">Consumers</text>
  <g font-size="12.5" font-weight="600" fill="#22313A" text-anchor="middle">
    <rect x="166" y="115" width="98" height="48" rx="12" fill="#FFFFFF" stroke="#DDE8E4" stroke-width="1.5"/>
    <text x="215" y="144">原生 PHP</text>
    <rect x="271" y="115" width="98" height="48" rx="12" fill="#FFFFFF" stroke="#DDE8E4" stroke-width="1.5"/>
    <text x="320" y="144">Laravel 7–11</text>
    <rect x="376" y="115" width="98" height="48" rx="12" fill="#FFFFFF" stroke="#DDE8E4" stroke-width="1.5"/>
    <text x="425" y="144">ThinkPHP 6/8</text>
    <rect x="481" y="115" width="98" height="48" rx="12" fill="#FFFFFF" stroke="#DDE8E4" stroke-width="1.5"/>
    <text x="530" y="144">Hyperf 2/3</text>
    <rect x="586" y="115" width="98" height="48" rx="12" fill="#FFFFFF" stroke="#DDE8E4" stroke-width="1.5"/>
    <text x="635" y="144">webman</text>
  </g>

  <!-- ── 泳道 2：集成层 ── -->
  <rect x="40" y="192" width="650" height="86" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="224" font-size="13.5" font-weight="700" fill="#22313A">集成层</text>
  <text x="56" y="244" font-size="11" fill="#8FA8A2">Integrations</text>
  <g text-anchor="middle">
    <rect x="166" y="208" width="98" height="54" rx="12" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="215" y="230" font-size="11" font-weight="600" fill="#22313A">bootstrap.php</text>
    <text x="215" y="248" font-size="10.5" fill="#7C8B93">原生 PHP</text>
    <rect x="271" y="208" width="98" height="54" rx="12" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="320" y="230" font-size="11" font-weight="600" fill="#22313A">ServiceProvider</text>
    <text x="320" y="248" font-size="10.5" fill="#7C8B93">Laravel</text>
    <rect x="376" y="208" width="98" height="54" rx="12" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="425" y="230" font-size="11" font-weight="600" fill="#22313A">think\Service</text>
    <text x="425" y="248" font-size="10.5" fill="#7C8B93">ThinkPHP</text>
    <rect x="481" y="208" width="98" height="54" rx="12" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="530" y="230" font-size="11" font-weight="600" fill="#22313A">ConfigProvider</text>
    <text x="530" y="248" font-size="10.5" fill="#7C8B93">Hyperf</text>
    <rect x="586" y="208" width="98" height="54" rx="12" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="635" y="230" font-size="11" font-weight="600" fill="#22313A">Install 插件</text>
    <text x="635" y="248" font-size="10.5" fill="#7C8B93">webman</text>
  </g>

  <!-- ── 泳道 3：服务层 ── -->
  <rect x="40" y="292" width="650" height="86" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="330" font-size="13.5" font-weight="700" fill="#22313A">服务层</text>
  <text x="56" y="350" font-size="11" fill="#8FA8A2">Service</text>
  <rect x="166" y="304" width="517" height="62" rx="14" fill="#EEF8F1" stroke="#CBE7D5" stroke-width="1.5"/>
  <text x="180" y="326" font-size="12.5" font-weight="700" fill="#1F5B39">SeasonService</text>
  <text x="300" y="326" font-size="10.5" fill="#5E8A73">按类名注入容器（Laravel / ThinkPHP / Hyperf / webman）</text>
  <g font-size="10.5" fill="#255C3E" text-anchor="middle">
    <rect x="174" y="334" width="110" height="24" rx="8" fill="#FFFFFF" stroke="#CBE7D5" stroke-width="1.2"/>
    <text x="229" y="350">默认国家码</text>
    <rect x="290" y="334" width="190" height="24" rx="8" fill="#FFFFFF" stroke="#CBE7D5" stroke-width="1.2"/>
    <text x="385" y="350">getSeasonForDefault()</text>
    <rect x="486" y="334" width="190" height="24" rx="8" fill="#FFFFFF" stroke="#CBE7D5" stroke-width="1.2"/>
    <text x="581" y="350" font-size="10">setDefaultCountryCode() 即时校验</text>
  </g>

  <!-- ── 泳道 4：核心层 ── -->
  <rect x="40" y="392" width="650" height="92" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="430" font-size="13.5" font-weight="700" fill="#22313A">核心层</text>
  <text x="56" y="450" font-size="11" fill="#8FA8A2">Core</text>
  <rect x="166" y="404" width="247" height="68" rx="14" fill="#FFF6EC" stroke="#F2DDC4" stroke-width="1.5"/>
  <text x="182" y="428" font-size="12.5" font-weight="700" fill="#8A4B14">CountrySeason</text>
  <text x="182" y="447" font-size="10.5" fill="#946B44">静态门面：季节 / 半球 / 国旗 / 多语言</text>
  <text x="182" y="463" font-size="10.5" fill="#946B44">常量 SEASON_* · HEMISPHERE_*</text>
  <rect x="437" y="404" width="247" height="68" rx="14" fill="#FFF6EC" stroke="#F2DDC4" stroke-width="1.5"/>
  <text x="453" y="428" font-size="12.5" font-weight="700" fill="#8A4B14">helpers.php</text>
  <text x="453" y="447" font-size="10.5" fill="#946B44">country_season() · _zh() · _flag() · _locale()</text>
  <text x="453" y="463" font-size="10.5" fill="#946B44">composer autoload files 自动加载</text>

  <!-- ── 泳道 5：数据层 ── -->
  <rect x="40" y="498" width="650" height="98" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="540" font-size="13.5" font-weight="700" fill="#22313A">数据层</text>
  <text x="56" y="560" font-size="11" fill="#8FA8A2">Data</text>
  <g text-anchor="middle">
    <rect x="166" y="512" width="164" height="70" rx="14" fill="#F3F1FB" stroke="#DEDAF2" stroke-width="1.5"/>
    <text x="248" y="536" font-size="12" font-weight="600" fill="#3F3A66">南半球代码表</text>
    <text x="248" y="554" font-size="10.5" fill="#6C679A">SOUTH_HEMISPHERE_CODES</text>
    <text x="248" y="571" font-size="10.5" fill="#6C679A">ISO 码对照表 · O(1) 查表</text>
    <rect x="343" y="512" width="164" height="70" rx="14" fill="#F3F1FB" stroke="#DEDAF2" stroke-width="1.5"/>
    <text x="425" y="536" font-size="12" font-weight="600" fill="#3F3A66">月份 → 季节映射</text>
    <text x="425" y="554" font-size="10.5" fill="#6C679A">MONTH_TO_SEASON_NORTH</text>
    <text x="425" y="571" font-size="10.5" fill="#6C679A">MONTH_TO_SEASON_SOUTH</text>
    <rect x="520" y="512" width="164" height="70" rx="14" fill="#F3F1FB" stroke="#DEDAF2" stroke-width="1.5"/>
    <text x="602" y="536" font-size="12" font-weight="600" fill="#3F3A66">LocaleData</text>
    <text x="602" y="554" font-size="10.5" fill="#6C679A">NAMES：语言级季节名</text>
    <text x="602" y="571" font-size="10.5" fill="#6C679A">OVERRIDES：区域级覆盖</text>
  </g>

  <!-- ── 层间箭头 ── -->
  <g stroke="#8FA8A2" stroke-width="2" marker-end="url(#ar)">
    <line x1="424" y1="179" x2="424" y2="189"/>
    <line x1="424" y1="279" x2="424" y2="289"/>
    <line x1="424" y1="379" x2="424" y2="389"/>
    <line x1="424" y1="485" x2="424" y2="495"/>
  </g>
  <g font-size="10" fill="#8FA8A2">
    <text x="434" y="188">发现 / 注册</text>
    <text x="434" y="288">绑定 / 合并配置</text>
    <text x="434" y="388">委托调用</text>
    <text x="434" y="494">查表</text>
  </g>
  <g stroke="#8FA8A2" stroke-width="2" marker-end="url(#ar)">
    <line x1="417" y1="438" x2="433" y2="438"/>
  </g>

  <!-- ── 右栏：配置来源 ── -->
  <rect x="716" y="100" width="204" height="178" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="732" y="128" font-size="13" font-weight="700" fill="#22313A">配置来源 · Config</text>
  <g font-size="11" fill="#5A6B75">
    <text x="732" y="152">env COUNTRY_SEASON_DEFAULT</text>
    <text x="732" y="168" fill="#8FA8A2">（默认 CN）</text>
    <text x="732" y="194">config country_season</text>
    <text x="732" y="210">.default_country_code</text>
    <text x="732" y="236">webman 插件 app.php</text>
    <text x="732" y="252" fill="#8FA8A2">config/plugin/erikwang2013</text>
  </g>
  <path d="M716 200 C 700 200 702 235 690 235" fill="none" stroke="#B9C9C4" stroke-width="2" marker-end="url(#ar-soft)"/>
  <text x="712" y="189" font-size="10" fill="#8FA8A2" text-anchor="end">读取默认国家码</text>

  <!-- ── 右栏：输出 ── -->
  <rect x="716" y="292" width="204" height="322" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="732" y="320" font-size="13" font-weight="700" fill="#22313A">输出 · Output</text>
  <text x="732" y="344" font-size="11" fill="#8FA8A2">季节键 seasons</text>
  <g font-size="10.5" fill="#255C3E" text-anchor="middle">
    <rect x="732" y="352" width="88" height="24" rx="8" fill="#EEF8F1" stroke="#CBE7D5" stroke-width="1.2"/>
    <text x="776" y="368">spring</text>
    <rect x="828" y="352" width="88" height="24" rx="8" fill="#FFF6EC" stroke="#F2DDC4" stroke-width="1.2"/>
    <text x="872" y="368" fill="#8A4B14">summer</text>
    <rect x="732" y="382" width="88" height="24" rx="8" fill="#FDF0E9" stroke="#F0D6C2" stroke-width="1.2"/>
    <text x="776" y="398" fill="#8A4B14">autumn</text>
    <rect x="828" y="382" width="88" height="24" rx="8" fill="#EEF5FC" stroke="#D3E5F5" stroke-width="1.2"/>
    <text x="872" y="398" fill="#245B86">winter</text>
  </g>
  <g font-size="11" fill="#5A6B75">
    <text x="732" y="432">中文：春 / 夏 / 秋 / 冬</text>
    <text x="732" y="458">国旗 Emoji（区域指示符）</text>
    <text x="732" y="484">季节 Emoji：🌸 ☀️ 🍁 ❄️</text>
    <text x="732" y="510">多语言：Frühling · 봄 · Primavera</text>
    <text x="732" y="536">半球：north / south</text>
    <text x="732" y="562">吉祥物：季节主题 SVG</text>
    <text x="732" y="588" fill="#8FA8A2">异常：InvalidArgumentException</text>
    <text x="732" y="604" fill="#8FA8A2">（非两字母国家码）</text>
  </g>
  <path d="M688 438 C 700 438 704 420 714 420" fill="none" stroke="#B9C9C4" stroke-width="2" marker-end="url(#ar-soft)"/>

  <text x="40" y="626" font-size="11" fill="#8FA8A2">箭头方向 = 依赖 / 调用方向　·　零运行时依赖：PHP ≥ 8.0 + ext-mbstring　·　无网络、无数据库、无可变全局状态</text>
  <text x="40" y="646" font-size="11" fill="#8FA8A2">原生 PHP（无 Composer）：require src/bootstrap.php —— 内置 PHP 版本检查、SPL 自动加载与助手函数；用 Composer 安装时无需引入</text>
</svg>
