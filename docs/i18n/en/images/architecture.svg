<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="arch-title arch-desc"
     font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Source Han Sans SC, sans-serif">
  <title id="arch-title">season architecture: consumers → integrations → service → core → data</title>
  <desc id="arch-desc">Layered architecture diagram. Top: native PHP and Laravel / ThinkPHP / Hyperf / Yii / webman consumers. Integrations: framework service providers, the Yii bootstrap and config files, and the webman installer. Service: SeasonService holds the default country code and proxies the core API. Core: CountrySeason and global helpers.php. Data: southern hemisphere table, month-to-season maps and LocaleData.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FA8A2"/>
    </marker>
    <marker id="ar-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B9C9C4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="660" rx="28" fill="#F7FAF9"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="#22313A">Architecture design</text>
  <text x="40" y="82" font-size="13" fill="#6B7C86">season: maps an ISO 3166-1 alpha-2 country code to the current season; use it as a Composer package or in framework containers.</text>

  <!-- ── Lane 1: consumers ── -->
  <rect x="40" y="100" width="650" height="78" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="132" font-size="13.5" font-weight="700" fill="#22313A">Consumers</text>
  <text x="56" y="152" font-size="11" fill="#8FA8A2">Callers</text>
  <g font-size="11" font-weight="600" fill="#22313A" text-anchor="middle">
    <rect x="166" y="115" width="80" height="48" rx="12" fill="#FFFFFF" stroke="#DDE8E4" stroke-width="1.5"/>
    <text x="206" y="144">Native PHP</text>
    <rect x="253" y="115" width="80" height="48" rx="12" fill="#FFFFFF" stroke="#DDE8E4" stroke-width="1.5"/>
    <text x="293" y="144">Laravel 7-11</text>
    <rect x="340" y="115" width="80" height="48" rx="12" fill="#FFFFFF" stroke="#DDE8E4" stroke-width="1.5"/>
    <text x="380" y="144">ThinkPHP 6/8</text>
    <rect x="427" y="115" width="80" height="48" rx="12" fill="#FFFFFF" stroke="#DDE8E4" stroke-width="1.5"/>
    <text x="467" y="144">Hyperf 2/3</text>
    <rect x="514" y="115" width="80" height="48" rx="12" fill="#FFFFFF" stroke="#DDE8E4" stroke-width="1.5"/>
    <text x="554" y="144">Yii 2 / 3</text>
    <rect x="601" y="115" width="80" height="48" rx="12" fill="#FFFFFF" stroke="#DDE8E4" stroke-width="1.5"/>
    <text x="641" y="144">webman</text>
  </g>

  <!-- ── Lane 2: integrations ── -->
  <rect x="40" y="192" width="650" height="86" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="224" font-size="13.5" font-weight="700" fill="#22313A">Integrations</text>
  <text x="56" y="244" font-size="11" fill="#8FA8A2">Framework hooks</text>
  <g text-anchor="middle">
    <rect x="166" y="208" width="80" height="54" rx="12" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="206" y="230" font-size="10" font-weight="600" fill="#22313A">bootstrap.php</text>
    <text x="206" y="248" font-size="9.5" fill="#7C8B93">Native PHP</text>
    <rect x="253" y="208" width="80" height="54" rx="12" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="293" y="230" font-size="10" font-weight="600" fill="#22313A">ServiceProvider</text>
    <text x="293" y="248" font-size="9.5" fill="#7C8B93">Laravel</text>
    <rect x="340" y="208" width="80" height="54" rx="12" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="380" y="230" font-size="10" font-weight="600" fill="#22313A">think\Service</text>
    <text x="380" y="248" font-size="9.5" fill="#7C8B93">ThinkPHP</text>
    <rect x="427" y="208" width="80" height="54" rx="12" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="467" y="230" font-size="10" font-weight="600" fill="#22313A">ConfigProvider</text>
    <text x="467" y="248" font-size="9.5" fill="#7C8B93">Hyperf</text>
    <rect x="514" y="208" width="80" height="54" rx="12" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="554" y="230" font-size="10" font-weight="600" fill="#22313A">Yii integration</text>
    <text x="554" y="248" font-size="8.5" fill="#7C8B93">Bootstrap · di.php</text>
    <rect x="601" y="208" width="80" height="54" rx="12" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="641" y="230" font-size="10" font-weight="600" fill="#22313A">Install plugin</text>
    <text x="641" y="248" font-size="9.5" fill="#7C8B93">webman</text>
  </g>

  <!-- ── Lane 3: service ── -->
  <rect x="40" y="292" width="650" height="86" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="330" font-size="13.5" font-weight="700" fill="#22313A">Service</text>
  <text x="56" y="350" font-size="11" fill="#8FA8A2">Container service</text>
  <rect x="166" y="304" width="517" height="62" rx="14" fill="#EEF8F1" stroke="#CBE7D5" stroke-width="1.5"/>
  <text x="180" y="326" font-size="12.5" font-weight="700" fill="#1F5B39">SeasonService</text>
  <text x="300" y="326" font-size="10.5" fill="#5E8A73">Resolved by class in Laravel / ThinkPHP / Hyperf / Yii / webman</text>
  <g font-size="10.5" fill="#255C3E" text-anchor="middle">
    <rect x="174" y="334" width="110" height="24" rx="8" fill="#FFFFFF" stroke="#CBE7D5" stroke-width="1.2"/>
    <text x="229" y="350" font-size="10">Default country code</text>
    <rect x="290" y="334" width="190" height="24" rx="8" fill="#FFFFFF" stroke="#CBE7D5" stroke-width="1.2"/>
    <text x="385" y="350">getSeasonForDefault()</text>
    <rect x="486" y="334" width="190" height="24" rx="8" fill="#FFFFFF" stroke="#CBE7D5" stroke-width="1.2"/>
    <text x="581" y="350" font-size="10">setDefaultCountryCode() validates</text>
  </g>

  <!-- ── Lane 4: core ── -->
  <rect x="40" y="392" width="650" height="92" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="430" font-size="13.5" font-weight="700" fill="#22313A">Core</text>
  <text x="56" y="450" font-size="11" fill="#8FA8A2">Facade and helpers</text>
  <rect x="166" y="404" width="247" height="68" rx="14" fill="#FFF6EC" stroke="#F2DDC4" stroke-width="1.5"/>
  <text x="182" y="428" font-size="12.5" font-weight="700" fill="#8A4B14">CountrySeason</text>
  <text x="182" y="447" font-size="10.5" fill="#946B44">Static facade: season, hemisphere, flag, locale</text>
  <text x="182" y="463" font-size="10.5" fill="#946B44">Constants SEASON_* · HEMISPHERE_*</text>
  <rect x="437" y="404" width="247" height="68" rx="14" fill="#FFF6EC" stroke="#F2DDC4" stroke-width="1.5"/>
  <text x="453" y="428" font-size="12.5" font-weight="700" fill="#8A4B14">helpers.php</text>
  <text x="453" y="447" font-size="10.5" fill="#946B44">country_season() · _zh() · _flag() · _locale()</text>
  <text x="453" y="463" font-size="10.5" fill="#946B44">Composer autoload files</text>

  <!-- ── Lane 5: data ── -->
  <rect x="40" y="498" width="650" height="98" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="540" font-size="13.5" font-weight="700" fill="#22313A">Data</text>
  <text x="56" y="560" font-size="11" fill="#8FA8A2">Lookup tables</text>
  <g text-anchor="middle">
    <rect x="166" y="512" width="164" height="70" rx="14" fill="#F3F1FB" stroke="#DEDAF2" stroke-width="1.5"/>
    <text x="248" y="536" font-size="12" font-weight="600" fill="#3F3A66">Southern hemisphere codes</text>
    <text x="248" y="554" font-size="10.5" fill="#6C679A">SOUTH_HEMISPHERE_CODES</text>
    <text x="248" y="571" font-size="10.5" fill="#6C679A">ISO code table · O(1) lookup</text>
    <rect x="343" y="512" width="164" height="70" rx="14" fill="#F3F1FB" stroke="#DEDAF2" stroke-width="1.5"/>
    <text x="425" y="536" font-size="12" font-weight="600" fill="#3F3A66">Month → season map</text>
    <text x="425" y="554" font-size="10.5" fill="#6C679A">MONTH_TO_SEASON_NORTH</text>
    <text x="425" y="571" font-size="10.5" fill="#6C679A">MONTH_TO_SEASON_SOUTH</text>
    <rect x="520" y="512" width="164" height="70" rx="14" fill="#F3F1FB" stroke="#DEDAF2" stroke-width="1.5"/>
    <text x="602" y="536" font-size="12" font-weight="600" fill="#3F3A66">LocaleData</text>
    <text x="602" y="554" font-size="10.5" fill="#6C679A">NAMES: language season names</text>
    <text x="602" y="571" font-size="10.5" fill="#6C679A">OVERRIDES: regional overrides</text>
  </g>

  <!-- ── Layer arrows ── -->
  <g stroke="#8FA8A2" stroke-width="2" marker-end="url(#ar)">
    <line x1="424" y1="179" x2="424" y2="189"/>
    <line x1="424" y1="279" x2="424" y2="289"/>
    <line x1="424" y1="379" x2="424" y2="389"/>
    <line x1="424" y1="485" x2="424" y2="495"/>
  </g>
  <g font-size="10" fill="#8FA8A2">
    <text x="434" y="188">Discover / register</text>
    <text x="434" y="288">Bind / merge config</text>
    <text x="434" y="388">Delegate call</text>
    <text x="434" y="494">Lookup</text>
  </g>
  <g stroke="#8FA8A2" stroke-width="2" marker-end="url(#ar)">
    <line x1="417" y1="438" x2="433" y2="438"/>
  </g>

  <!-- ── Right column: config sources ── -->
  <rect x="716" y="100" width="204" height="178" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="732" y="128" font-size="13" font-weight="700" fill="#22313A">Config sources</text>
  <g font-size="11" fill="#5A6B75">
    <text x="732" y="150">env COUNTRY_SEASON_DEFAULT</text>
    <text x="732" y="165" fill="#8FA8A2">(default CN)</text>
    <text x="732" y="186">Laravel / ThinkPHP / Hyperf</text>
    <text x="732" y="201">country_season.default_country_code</text>
    <text x="732" y="220">Yii2 params country_season</text>
    <text x="732" y="235">Yii3 params erikwang2013/season</text>
    <text x="732" y="254">webman plugin app.php</text>
    <text x="732" y="269" fill="#8FA8A2">config/plugin/erikwang2013</text>
  </g>
  <path d="M716 200 C 700 200 702 235 690 235" fill="none" stroke="#B9C9C4" stroke-width="2" marker-end="url(#ar-soft)"/>
  <text x="712" y="189" font-size="10" fill="#8FA8A2" text-anchor="end">Read default country</text>

  <!-- ── Right column: output ── -->
  <rect x="716" y="292" width="204" height="322" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="732" y="320" font-size="13" font-weight="700" fill="#22313A">Output</text>
  <text x="732" y="344" font-size="11" fill="#8FA8A2">Season keys</text>
  <g font-size="10.5" fill="#255C3E" text-anchor="middle">
    <rect x="732" y="352" width="88" height="24" rx="8" fill="#EEF8F1" stroke="#CBE7D5" stroke-width="1.2"/>
    <text x="776" y="368">spring</text>
    <rect x="828" y="352" width="88" height="24" rx="8" fill="#FFF6EC" stroke="#F2DDC4" stroke-width="1.2"/>
    <text x="872" y="368" fill="#8A4B14">summer</text>
    <rect x="732" y="382" width="88" height="24" rx="8" fill="#FDF0E9" stroke="#F0D6C2" stroke-width="1.2"/>
    <text x="776" y="398" fill="#8A4B14">autumn</text>
    <rect x="828" y="382" width="88" height="24" rx="8" fill="#EEF5FC" stroke="#D3E5F5" stroke-width="1.2"/>
    <text x="872" y="398" fill="#245B86">winter</text>
  </g>
  <g font-size="11" fill="#5A6B75">
    <text x="732" y="432">Chinese: 春 / 夏 / 秋 / 冬</text>
    <text x="732" y="458">Flag emoji (regional indicators)</text>
    <text x="732" y="484">Season emoji: 🌸 ☀️ 🍁 ❄️</text>
    <text x="732" y="510">Locales: Frühling · 봄 · Primavera</text>
    <text x="732" y="536">Hemisphere: north / south</text>
    <text x="732" y="562">Mascot: season-themed SVG</text>
    <text x="732" y="588" fill="#8FA8A2">Throws: InvalidArgumentException</text>
    <text x="732" y="604" fill="#8FA8A2">(not a two-letter code)</text>
  </g>
  <path d="M688 438 C 700 438 704 420 714 420" fill="none" stroke="#B9C9C4" stroke-width="2" marker-end="url(#ar-soft)"/>

  <text x="40" y="626" font-size="11" fill="#8FA8A2">Arrow direction = dependency / call direction · zero runtime dependencies: PHP ≥ 8.0 + ext-mbstring · no network, database or mutable global state</text>
  <text x="40" y="646" font-size="11" fill="#8FA8A2">Native PHP (no Composer): require src/bootstrap.php; includes a PHP version check, SPL autoloader and helpers. Not needed with Composer.</text>
</svg>
