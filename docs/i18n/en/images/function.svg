<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="fn-title fn-desc"
     font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Source Han Sans SC, sans-serif">
  <title id="fn-title">season feature map: input, core and eight capabilities</title>
  <desc id="fn-desc">Feature map. Inputs on the left (country code, optional date, optional locale, configured default country), CountrySeason and SeasonService in the center, and eight capability cards on the right: season lookup, Chinese names, flag emoji, localized names, hemisphere, code validation, default country and season-themed mascot. Framework integrations sit at the bottom.</desc>

  <defs>
    <marker id="ar-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FA8A2"/>
    </marker>
    <linearGradient id="f-spring" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#A8E7BC"/>
      <stop offset="1" stop-color="#5FBF6A"/>
    </linearGradient>
    <linearGradient id="f-autumn" x1="1" y1="1" x2="0.1" y2="0.1">
      <stop offset="0" stop-color="#EE8A44"/>
      <stop offset="1" stop-color="#F3B96C"/>
    </linearGradient>
    <clipPath id="f-body">
      <circle cx="395" cy="218" r="40"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="960" height="620" rx="28" fill="#F7FAF9"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="#22313A">Feature Map</text>
  <text x="40" y="82" font-size="13" fill="#6B7C86">One entry point (country code + optional date): eight pure functions with deterministic output, no network, database or global state.</text>

  <!-- ── Input ── -->
  <rect x="40" y="110" width="230" height="170" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="138" font-size="13" font-weight="700" fill="#22313A">Input</text>
  <g font-size="11" fill="#5A6B75">
    <text x="56" y="166">Country code: country_code</text>
    <text x="56" y="182" font-size="10" fill="#8FA8A2">ISO 3166-1 alpha-2, case-insensitive</text>
    <text x="56" y="208">Date: date (optional)</text>
    <text x="56" y="224" font-size="10" fill="#8FA8A2">Defaults to the current time</text>
    <text x="56" y="250">locale (optional)</text>
    <text x="56" y="266" font-size="10" fill="#8FA8A2">BCP 47: zh_CN, en_US, de ...</text>
  </g>

  <!-- ── Below input: config ── -->
  <rect x="40" y="298" width="230" height="158" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="326" font-size="13" font-weight="700" fill="#22313A">Config</text>
  <g font-size="10.5" fill="#5A6B75">
    <text x="56" y="352">default_country_code</text>
    <text x="56" y="370">env COUNTRY_SEASON_DEFAULT</text>
    <text x="56" y="388" fill="#8FA8A2">(default CN, editable after publish)</text>
    <text x="56" y="416">Processing order:</text>
    <text x="56" y="434" fill="#3C8FD1">docs/lifecycle.svg</text>
  </g>
  <line x1="56" y1="396" x2="254" y2="396" stroke="#EAF1EF" stroke-width="1.5"/>

  <!-- ── Core ── -->
  <rect x="310" y="110" width="170" height="346" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="395" y="146" font-size="13" font-weight="700" fill="#22313A" text-anchor="middle">Core</text>
  <circle cx="395" cy="218" r="40" fill="url(#f-spring)"/>
  <g clip-path="url(#f-body)">
    <circle cx="416" cy="238" r="48" fill="url(#f-autumn)"/>
  </g>
  <circle cx="395" cy="218" r="40" fill="none" stroke="#22313A" stroke-opacity=".14" stroke-width="1.5"/>
  <g fill="#22313A">
    <circle cx="382" cy="212" r="4"/>
    <circle cx="408" cy="212" r="4"/>
  </g>
  <path d="M389 224 Q395 230 401 224" fill="none" stroke="#22313A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M395 178 C 395 172 395 168 395 164" fill="none" stroke="#5FBF6A" stroke-width="3" stroke-linecap="round"/>
  <path d="M395 170 C 387 171 382 166 383 159 C 390 160 394 164 395 170 Z" fill="#5FBF6A"/>
  <text x="395" y="288" font-size="12.5" font-weight="700" fill="#22313A" text-anchor="middle">CountrySeason</text>
  <text x="395" y="306" font-size="12.5" font-weight="700" fill="#22313A" text-anchor="middle">SeasonService</text>
  <g font-size="10" fill="#8FA8A2" text-anchor="middle">
    <text x="395" y="332">Static facade + container service</text>
    <text x="395" y="350">Pure functions, no side effects</text>
    <text x="395" y="368">protected static, overridable</text>
    <text x="395" y="396" fill="#3C8FD1">helpers.php: four global functions</text>
    <text x="395" y="412">country_season · _zh</text>
    <text x="395" y="426">_flag · _locale</text>
    <text x="395" y="448" fill="#3C8FD1">Mascot</text>
  </g>

  <g stroke="#8FA8A2" stroke-width="2" marker-end="url(#ar-f)" fill="none">
    <line x1="272" y1="195" x2="306" y2="195"/>
    <path d="M482 283 C 500 283 508 148 526 148"/>
    <path d="M482 283 C 500 283 508 238 526 238"/>
    <path d="M482 283 C 500 283 508 328 526 328"/>
    <path d="M482 283 C 500 283 508 418 526 418"/>
  </g>

  <!-- ── Capability cards ── -->
  <g>
    <rect x="530" y="110" width="186" height="76" rx="14" fill="#EEF8F1" stroke="#CBE7D5" stroke-width="1.5"/>
    <text x="542" y="132" font-size="12" font-weight="700" fill="#1F5B39">Season lookup</text>
    <text x="542" y="152" font-size="9.5" fill="#5E8A73">getSeason('CN')</text>
    <text x="542" y="171" font-size="10" fill="#1F5B39">→ 'spring' … 'winter'</text>

    <rect x="734" y="110" width="186" height="76" rx="14" fill="#EEF8F1" stroke="#CBE7D5" stroke-width="1.5"/>
    <text x="746" y="132" font-size="12" font-weight="700" fill="#1F5B39">Chinese names</text>
    <text x="746" y="152" font-size="9.5" fill="#5E8A73">getSeasonNameZh('CN')</text>
    <text x="746" y="171" font-size="10" fill="#1F5B39">→ 春 / 夏 / 秋 / 冬</text>

    <rect x="530" y="200" width="186" height="76" rx="14" fill="#FFF6EC" stroke="#F2DDC4" stroke-width="1.5"/>
    <text x="542" y="221" font-size="12" font-weight="700" fill="#8A4B14">Flag and season emoji</text>
    <text x="542" y="241" font-size="9.5" fill="#946B44">getCountryFlagEmoji('CN') → 🇨🇳</text>
    <text x="542" y="259" font-size="9.5" fill="#946B44">getSeasonEmoji('CN') → ❄️</text>

    <rect x="734" y="200" width="186" height="76" rx="14" fill="#FFF6EC" stroke="#F2DDC4" stroke-width="1.5"/>
    <text x="746" y="222" font-size="12" font-weight="700" fill="#8A4B14">Localized names</text>
    <text x="746" y="242" font-size="9.5" fill="#946B44">getSeasonNameLocalized(</text>
    <text x="746" y="256" font-size="9.5" fill="#946B44">  'DE', 'de_DE')  → Frühling</text>

    <rect x="530" y="290" width="186" height="76" rx="14" fill="#EEF5FC" stroke="#D3E5F5" stroke-width="1.5"/>
    <text x="542" y="312" font-size="12" font-weight="700" fill="#245B86">Hemisphere</text>
    <text x="542" y="332" font-size="9.5" fill="#5A7FA0">getHemisphere('AU')</text>
    <text x="542" y="351" font-size="10" fill="#245B86">→ 'north' / 'south'</text>

    <rect x="734" y="290" width="186" height="76" rx="14" fill="#EEF5FC" stroke="#D3E5F5" stroke-width="1.5"/>
    <text x="746" y="312" font-size="12" font-weight="700" fill="#245B86">Code validation</text>
    <text x="746" y="332" font-size="9.5" fill="#5A7FA0">isValidCode('XX')</text>
    <text x="746" y="351" font-size="10" fill="#245B86">→ true / false (format only)</text>

    <rect x="530" y="380" width="186" height="76" rx="14" fill="#F3F1FB" stroke="#DEDAF2" stroke-width="1.5"/>
    <text x="542" y="402" font-size="12" font-weight="700" fill="#3F3A66">Default country</text>
    <text x="542" y="422" font-size="9.5" fill="#6C679A">getSeasonForDefault()</text>
    <text x="542" y="441" font-size="10" fill="#3F3A66">→ configured country code</text>

    <rect x="734" y="380" width="186" height="76" rx="14" fill="#FDF0F5" stroke="#F2D7E3" stroke-width="1.5"/>
    <text x="746" y="402" font-size="12" font-weight="700" fill="#8A2B52">Mascot</text>
    <text x="746" y="422" font-size="9.5" fill="#9C6280">Mascot::forCountry('AU')</text>
    <text x="746" y="441" font-size="10" fill="#8A2B52">→ season-colored SVG</text>
  </g>

  <!-- ── Integrations ── -->
  <rect x="40" y="478" width="880" height="88" rx="16" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1.5"/>
  <text x="56" y="506" font-size="13" font-weight="700" fill="#22313A">Integrations</text>
  <text x="270" y="506" font-size="11" fill="#8FA8A2">One API, optional bindings for framework containers; works with or without them in plain Composer</text>
  <g font-size="10.5" fill="#5A6B75" text-anchor="middle">
    <rect x="56" y="518" width="161" height="32" rx="10" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.2"/>
    <text x="136" y="538" font-weight="600" fill="#245B86">Laravel | ServiceProvider</text>
    <rect x="227" y="518" width="161" height="32" rx="10" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.2"/>
    <text x="307" y="538" font-weight="600" fill="#245B86">ThinkPHP | think\Service</text>
    <rect x="398" y="518" width="161" height="32" rx="10" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.2"/>
    <text x="478" y="538" font-weight="600" fill="#245B86">Hyperf | ConfigProvider</text>
    <rect x="569" y="518" width="161" height="32" rx="10" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.2"/>
    <text x="649" y="538" font-weight="600" fill="#245B86">Yii 2/3 | Bootstrap · di</text>
    <rect x="740" y="518" width="161" height="32" rx="10" fill="#F4F8FF" stroke="#D8E6F8" stroke-width="1.2"/>
    <text x="820" y="538" font-weight="600" fill="#245B86">webman | Install plugin</text>
  </g>

  <text x="40" y="598" font-size="11" fill="#8FA8A2">Output follows the current date and hemisphere: in July, north is summer and south is winter. Invalid codes throw InvalidArgumentException.</text>
</svg>
